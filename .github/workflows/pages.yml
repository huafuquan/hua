name: Publish Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2
          mkdir -p public/debs
          touch public/.nojekyll
          cp -f debs/*.deb public/debs/ 2>/dev/null || true
          cp -f icon.png CydiaIcon.png public/ 2>/dev/null || true
          cd public
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -n -k Packages
          bzip2 -k Packages
          printf 'Origin: hua\nLabel: hua\nSuite: stable\nCodename: sileo\nArchitectures: iphoneos-arm64 iphoneos-arm64e\nComponents: main\nDescription: hua\n' > Release
          cp ../index.html index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
